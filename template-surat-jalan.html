<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Surat Jalan - CV. KIRAMANA</title>
    <style>
      @page {
        size: A5;
        margin: 1cm;
      }
      body {
        font-family: Arial, sans-serif;
        font-size: 12pt;
        line-height: 1.5;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 100%;
        max-width: 148mm; /* Lebar A5 dalam mm */
        margin: 0 auto;
        padding: 1cm;
      }
      .header {
        text-align: left;
        margin-bottom: 10px;
      }
      .header h1 {
        margin: 0;
        font-size: 18pt;
        font-weight: bold;
        text-decoration: underline;
      }
      .header h2 {
        margin: 0;
        font-size: 16pt;
        font-weight: bold;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .info-box {
        width: 48%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        margin-bottom: 20px;
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
        text-align: center;
      }
      th {
        font-weight: bold;
      }
      .date-row {
        text-align: right;
        margin-bottom: 30px;
      }
      .signature-row {
        display: flex;
        justify-content: space-around;
        margin-top: 50px;
      }
      .signature-box {
        text-align: center;
        width: 45%;
      }
      .signature-line {
        border-bottom: 1px solid black;
        margin: 20px 0;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>CV. KIRAMANA</h1>
        <h2>SURAT KIRIM</h2>
      </div>

      <div class="info-row">
        <div class="info-box">
          <strong>TRUCK:</strong> _________________________
        </div>
        <div class="info-box">
          <strong>TUJUAN:</strong> _________________________
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>NO</th>
            <th>JENIS MATERIAL</th>
            <th>JUMLAH</th>
            <th>KETERANGAN</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
          </tr>
          <tr>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
          </tr>
          <tr>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
            <td>&nbsp;</td>
          </tr>
        </tbody>
      </table>

      <div class="date-row">
        <strong>TANGGAL :</strong> _________________________
      </div>

      <div class="signature-row">
        <div class="signature-box">
          <div class="signature-line">&nbsp;</div>
          <strong>SOPIR</strong>
        </div>
        <div class="signature-box">
          <div class="signature-line">&nbsp;</div>
          <strong>PENGAWAS</strong>
        </div>
      </div>
    </div>
  </body>
</html>
